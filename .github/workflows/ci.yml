name: CI

on:
    - pull_request
    - push

jobs:
    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'npm'
            - run: npm ci
            - run: npm run type-check

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  # Fallow resolves the rules against the changed files, so the
                  # history has to be there.
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'npm'
            - run: npm ci
            - name: ESLint and fallow gates
              run: npm run lint
              env:
                  # Report the findings as inline annotations on the pull
                  # request instead of a wall of text in the log.
                  FALLOW_FORMAT: github-annotations

    test:
        name: Test (Node ${{matrix.node}})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: [22, 24]
        steps:
            - uses: actions/checkout@v7
              with:
                  # Fallow audit resolves its base against the remote history,
                  # so the merge-base has to be there.
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{matrix.node}}
                  cache: 'npm'
            - run: npm ci
            # Fails when the coverage drops below the thresholds in vitest.config.ts.
            - run: npm run coverage
            # The same audit the pre-commit hook runs, but with the coverage
            # data from the step above, so the CRAP scores are exact.
            - name: Fallow audit with coverage
              if: matrix.node == 24
              run: npx fallow audit --coverage coverage/coverage-final.json
              env:
                  FALLOW_FORMAT: github-annotations

    badges:
        name: Update health and coverage badges
        runs-on: ubuntu-latest
        needs: [typecheck, lint, test]
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'npm'
            - run: npm ci
            - run: npm run coverage
            - name: Write badges
              run: |
                  npx fallow health --format badge --coverage coverage/coverage-final.json > .github/badges/health.svg
                  node -e "const p = require('./coverage/coverage-summary.json').total.lines.pct; console.log(JSON.stringify({ schemaVersion: 1, label: 'coverage', message: p + '%', color: p >= 95 ? 'brightgreen' : p >= 75 ? 'yellow' : 'red' }))" > .github/badges/coverage.json
            - name: Commit badges
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add .github/badges/health.svg .github/badges/coverage.json
                  git diff --quiet --cached || git commit -m "chore: update the health and coverage badges [skip ci]"
                  git push
